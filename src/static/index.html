<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Tailor AI</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --editor-bg: #1e1e1e; --border: #e5e7eb; }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden;
        }

        /* Layout - Sidebar grows, Preview is capped */
        .main-content { 
            flex: 1; /* Takes up 60% by default */
            padding: 2rem; background: white; 
            border-right: 1px solid var(--border); overflow-y: auto; 
        }
        
        .preview-container { 
            width: 50%; /* Strict 50% width */
            max-width: 50%;
            display: flex; flex-direction: column; 
            background: var(--editor-bg); color: #d4d4d4;
        }

        #codePreview { 
            margin: 0; padding: 1.5rem; font-family: 'Fira Code', monospace; 
            font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre-wrap;
            flex-grow: 1;
        }

        /* Form Elements */
        .field { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
        textarea, input { width: 100%; padding: 0.8rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 200px; }

        .btn-group { display: flex; gap: 10px; }
        button { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 0.8rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none;
        }
        #generateBtn { background: var(--primary); color: white; flex-grow: 1; }
        #generateBtn:disabled { opacity: 0.6; }

        /* Preview Header & Utility Buttons */
        .preview-header { 
            padding: 0.75rem 1rem; background: #2d2d2d; border-bottom: 1px solid #444;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;
        }
        .util-btn { background: #444; color: #ddd; padding: 5px 10px; font-size: 0.7rem; display: none; }
        .util-btn:hover { background: #555; }

        .spinner {
            width: 14px; height: 14px; border: 2px solid white;
            border-bottom-color: transparent; border-radius: 50%;
            display: none; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-content">
        <h2 style="margin-top:0">Tailor AI</h2>
        <div class="field">
            <label>Target Job Description</label>
            <textarea id="jobDesc" placeholder="Paste the job requirements here..."></textarea>
        </div>
        <div class="field">
            <label>Master Resume (.txt)</label>
            <input type="file" id="resumeFile" accept=".txt">
        </div>
        <button id="generateBtn">
            <span id="btnText">Generate LaTeX</span>
            <div id="spinner" class="spinner"></div>
        </button>
        <p id="status" style="font-size: 0.85rem; color: #666;"></p>
    </div>

    <div class="preview-container">
        <div class="preview-header">
            <span style="letter-spacing: 1px; color: #888;">LATEX OUTPUT</span>
            <div style="display: flex; gap: 8px;">
                <button id="copyBtn" class="util-btn">Copy</button>
                <button id="downloadBtn" class="util-btn">Download .tex</button>
            </div>
        </div>
        <pre id="codePreview">% No code generated yet...</pre>
    </div>

    <script>
        const btn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const codePreview = document.getElementById('codePreview');
        const spinner = document.getElementById('spinner');

        let currentLatex = "";

        btn.addEventListener('click', async () => {
            const fileInput = document.getElementById('resumeFile');
            if (!fileInput.files[0]) return alert("Please upload a file");

            const formData = new FormData();
            formData.append('job_description', document.getElementById('jobDesc').value);
            formData.append('resume_file', fileInput.files[0]);

            btn.disabled = true;
            spinner.style.display = "block";
            codePreview.innerText = "% Tailoring in progress...";

            try {
                const response = await fetch('http://127.0.0.1:8002/tailor/generate', {
                    method: 'POST',
                    body: formData
                });
                
                currentLatex = await response.text();
                codePreview.innerText = currentLatex;
                
                // Show utility buttons
                downloadBtn.style.display = "block";
                copyBtn.style.display = "block";
            } catch (err) {
                codePreview.innerText = "Error: " + err.message;
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
            }
        });

        // Copy to clipboard logic
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(currentLatex).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                copyBtn.style.background = "#16a34a";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.background = "#444";
                }, 2000);
            });
        });

        // Download logic
        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([currentLatex], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "tailored_resume.tex";
            a.click();
        });
    </script>
</body>
</html>
