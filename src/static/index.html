<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Tailor AI</title>
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --editor-bg: #1e1e1e; --border: #e5e7eb; }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden;
        }

        .main-content { 
            flex: 1; padding: 2rem; background: white; 
            border-right: 1px solid var(--border); overflow-y: auto; 
        }
        
        .preview-container { 
            width: 50%; max-width: 50%; display: flex; flex-direction: column; 
            background: var(--editor-bg); color: #d4d4d4;
        }

        #codePreview { 
            margin: 0; padding: 1.5rem; font-family: 'Fira Code', monospace; 
            font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre-wrap; flex-grow: 1;
        }

        /* Input Styling */
        .section-title { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin: 1.5rem 0 0.75rem 0; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
        .field { margin-bottom: 1rem; }
        .grid-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.85rem; }
        textarea, input { width: 100%; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        textarea { height: 120px; }

        /* Buttons */
        button { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
        #generateBtn { width: 100%; padding: 0.8rem; background: var(--primary); color: white; margin-top: 1rem; }
        #generateBtn:disabled { opacity: 0.6; }

        .preview-header { padding: 0.75rem 1rem; background: #2d2d2d; border-bottom: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        .util-btn { background: #444; color: #ddd; padding: 5px 10px; font-size: 0.7rem; display: none; }

        .spinner { width: 14px; height: 14px; border: 2px solid white; border-bottom-color: transparent; border-radius: 50%; display: none; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="main-content">
        <h2 style="margin-top:0">Tailor AI</h2>
        
        <div class="section-title">Job Details</div>
        <div class="field">
            <label>Target Job Description</label>
            <textarea id="jobDesc" placeholder="Paste the job requirements..."></textarea>
        </div>
        <div class="field">
            <label>Master Resume (.txt)</label>
            <input type="file" id="resumeFile" accept=".txt">
        </div>

        <div class="section-title">Personal Info (Optional)</div>
        <div class="field">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Jane Doe">
        </div>
        
        <div class="grid-fields">
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="jane@example.com">
            </div>
            <div class="field">
                <label>Location</label>
                <input type="text" id="location" placeholder="City, Country">
            </div>
        </div>

        <div class="grid-fields">
            <div class="field">
                <label>LinkedIn URL</label>
                <input type="text" id="linkedin" placeholder="linkedin.com/in/{suffix of the url}">
            </div>
            <div class="field">
                <label>GitHub URL</label>
                <input type="text" id="github" placeholder="github.com/{username}">
            </div>
        </div>

        <button id="generateBtn">
            <span id="btnText">Generate LaTeX</span>
            <div id="spinner" class="spinner"></div>
        </button>
    </div>

    <div class="preview-container">
        <div class="preview-header">
            <span style="letter-spacing: 1px; color: #888; font-size: 0.7rem;">LATEX OUTPUT</span>
            <div style="display: flex; gap: 8px;">
                <button id="copyBtn" class="util-btn">Copy</button>
                <button id="texBtn" class="util-btn">.tex</button>
                <button id="docxBtn" class="util-btn primary">.docx</button>
            </div>
        </div>
        <pre id="codePreview">% Code will appear here...</pre>
    </div>

    <script>
        let currentResumeId = null;
        const btn = document.getElementById('generateBtn');
        const spinner = document.getElementById('spinner');
        const codePreview = document.getElementById('codePreview');
        const actionBtns = document.querySelectorAll('.util-btn');

        // Helper to get personal info query strings
        function getQueryParams() {
            return new URLSearchParams({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                location: document.getElementById('location').value,
                linkedin: document.getElementById('linkedin').value,
                github: document.getElementById('github').value
            }).toString();
        }

        btn.addEventListener('click', async () => {
            const fileInput = document.getElementById('resumeFile');
            if (!fileInput.files[0]) return alert("Please upload a .txt resume");

            const formData = new FormData();
            formData.append('job_description', document.getElementById('jobDesc').value);
            formData.append('resume_file', fileInput.files[0]);

            btn.disabled = true; spinner.style.display = "block";
            codePreview.innerText = "% AI is working...";

            try {
                // 1. POST to generate the ID
                const res = await fetch('http://127.0.0.1:8003/tailor/generate', { method: 'POST', body: formData });
                const data = await res.json();
                currentResumeId = data.resume_id;

                // 2. Automatically fetch LaTeX to show in preview
                const latexRes = await fetch(`http://127.0.0.1:8003/tailor/${currentResumeId}/latex?${getQueryParams()}`);
                codePreview.innerText = await latexRes.text();

                // 3. Show all buttons
                actionBtns.forEach(b => b.style.display = "block");
            } catch (err) {
                codePreview.innerText = "Error: " + err.message;
            } finally {
                btn.disabled = false; spinner.style.display = "none";
            }
        });

        // Copy LaTeX
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(codePreview.innerText);
            const original = document.getElementById('copyBtn').innerText;
            document.getElementById('copyBtn').innerText = "Copied!";
            setTimeout(() => document.getElementById('copyBtn').innerText = original, 2000);
        });

        // Download .tex
        document.getElementById('texBtn').addEventListener('click', () => {
            window.location.href = `http://127.0.0.1:8003/tailor/${currentResumeId}/latex?${getQueryParams()}`;
        });

        // Download .docx
        document.getElementById('docxBtn').addEventListener('click', () => {
            window.location.href = `http://127.0.0.1:8003/tailor/${currentResumeId}/docx?${getQueryParams()}`;
        });
    </script>
</body>
</html>
