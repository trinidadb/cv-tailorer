<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Tailor AI</title>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9fafb; color: #1f2937; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .field { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        textarea, input[type="file"] { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        
        /* Button & Spinner Styles */
        button { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 0.75rem; background: var(--primary); color: white; 
            border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #93c5fd; cursor: not-allowed; }

        .spinner {
            width: 18px; height: 18px; border: 2px solid #ffffff;
            border-bottom-color: transparent; border-radius: 50%;
            display: none; animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #status { margin-top: 1rem; font-size: 0.875rem; text-align: center; }
        .error { color: #dc2626; }
        .success { color: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Tailor Your Resume</h2>
        <div class="field">
            <label for="jobDesc">Job Description</label>
            <textarea id="jobDesc" placeholder="Paste the job requirements..."></textarea>
        </div>
        <div class="field">
            <label for="resumeFile">Master Resume (.txt)</label>
            <input type="file" id="resumeFile" accept=".txt">
        </div>
        <button id="generateBtn">
            <span id="btnText">Generate LaTeX Resume</span>
            <div id="spinner" class="spinner"></div>
        </button>
        <div id="status"></div>
    </div>

    <script>
        const btn = document.getElementById('generateBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            const jobDesc = document.getElementById('jobDesc').value;
            const fileInput = document.getElementById('resumeFile');

            if (!jobDesc || !fileInput.files[0]) {
                alert("Please fill in all fields.");
                return;
            }

            const formData = new FormData();
            formData.append('job_description', jobDesc);
            formData.append('resume_file', fileInput.files[0]);

            // UI Loading State
            btn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.innerText = "Tailoring...";
            status.className = "";
            status.innerText = "The AI is rewriting your resume. This usually takes 10-20 seconds.";

            try {
                const response = await fetch('http://127.0.0.1:8002/tailor/generate', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error(await response.text());

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "tailored_resume.tex";
                document.body.appendChild(a);
                a.click();
                
                status.className = "success";
                status.innerText = "Done! Check your downloads.";
            } catch (err) {
                status.className = "error";
                status.innerText = "Error: " + err.message;
            } finally {
                btn.disabled = false;
                spinner.style.display = "none";
                btnText.innerText = "Generate LaTeX Resume";
            }
        });
    </script>
</body>
</html>
